<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AURORA · FX — 观星台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="showcase.css" />
</head>
<body>

<!-- 3D 舞台 -->
<div id="stage"></div>

<!-- 氛围叠层：渐晕 / 胶片颗粒 / 扫描线 -->
<div id="vignette" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<div id="scanlines" aria-hidden="true"></div>

<!-- 顶部 HUD -->
<header id="hud-top">
  <div class="logo">
    <i class="logo-mark"></i>
    <div class="logo-text">
      <b>AURORA<span>·FX</span></b>
      <small>观星台</small>
    </div>
  </div>
  <div class="chips">
    <span class="chip" id="chipFps">FPS --</span>
    <span class="chip" id="chipGlx">WebGL · Three.js</span>
    <span class="chip" id="chipIdx">01 / 06</span>
  </div>
</header>

<!-- 章节标题 -->
<main id="titleWrap">
  <div class="ghost" id="tGhost">01</div>
  <h1 id="tMain">星河</h1>
  <p id="tSub">正在点亮…</p>
</main>

<!-- 章节坞 -->
<nav id="dock" aria-label="章节导航"></nav>

<div id="hint">移动鼠标 · 沉浸互动</div>
<div id="keys"><kbd>←</kbd><kbd>→</kbd> 切换&nbsp;&nbsp;<kbd>空格</kbd> 暂停轮播&nbsp;&nbsp;<kbd>1</kbd>-<kbd>6</kbd> 直达</div>

<!-- 转场闪光 -->
<div id="flash" aria-hidden="true"></div>

<!-- 自定义光标 -->
<div id="cursor" aria-hidden="true"><i id="cDot"></i><i id="cRing"></i></div>

<!-- 启动屏 -->
<div id="boot">
  <div class="boot-logo">A U R O R A</div>
  <div class="boot-bar"><i id="bootFill"></i></div>
  <div class="boot-status" id="bootStatus">初始化渲染管线…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="scenes.js"></script>
<script src="core.js"></script>
</body>
</html>
